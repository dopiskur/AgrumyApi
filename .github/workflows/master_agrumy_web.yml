# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

# This workflow requires an Azure Web App instance and GitHub Secrets
# (AZUREAPPSERVICE_CLIENTID_WEB, AZUREAPPSERVICE_TENANTID_WEB,
# AZUREAPPSERVICE_SUBSCRIPTIONID_WEB) to be set up manually before it can run
# successfully for the first time - see the README.md Deployment section.

name: Build and deploy Agrumy.Web to Azure Web App - agrumy-web

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Build with dotnet
        run: dotnet build Agrumy.Web/Agrumy.Web.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish Agrumy.Web/Agrumy.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myweb

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myweb

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_WEB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_WEB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_WEB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          # TODO: replace with the real Azure Web App name once it is created in the portal.
          app-name: 'agrumy-web'
          slot-name: 'Production'
          package: .
