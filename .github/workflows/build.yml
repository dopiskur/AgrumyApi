name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Build with dotnet
        run: dotnet build agrumy.sln --configuration Release

      - name: dotnet test
        run: dotnet test agrumy.sln --configuration Release --no-build
