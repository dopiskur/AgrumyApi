name: Server release

# Roadmap #30/#139: the ONLY process that produces a tagged, downloadable, self-contained
# linux-x64 build of Agrumy.Api/Agrumy.Web - separate from build.yml (the per-push regression
# gate), runs only on a semver tag. install.sh's bare-metal/standalone path downloads the latest
# release's tarballs instead of requiring a .NET SDK on the target server; #139 (future
# auto-update) is expected to reuse this same release feed once it exists.
#
# Publish flags match CLAUDE.md's documented manual-deploy recipe exactly (-r linux-x64
# --self-contained true -p:PublishSingleFile=true) - a plain `dotnet publish` on this
# Windows-hosted CI runner would otherwise produce a Windows apphost that fails silently on the
# Linux target (no build error, breaks at systemctl start - the exact trap CLAUDE.md documents
# from the first real deploy).
#
# Usage:  git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the release + upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [Agrumy.Api, Agrumy.Web]
    steps:
      # Roadmap #121: SHA-pinned (same practice as AgrumyFirmware's release.yml) - a moving major
      # tag could be repointed at anything; the pinned commit is exactly what was reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0'

      - name: Publish ${{ matrix.app }} (linux-x64, self-contained, single file)
        run: >
          dotnet publish ${{ matrix.app }}/${{ matrix.app }}.csproj
          -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true
          -o publish/${{ matrix.app }}

      - name: Verify ELF output, not a Windows apphost
        run: |
          BIN="publish/${{ matrix.app }}/${{ matrix.app }}"
          if ! file "$BIN" | grep -q 'ELF 64-bit'; then
            echo "::error::${{ matrix.app }} is not an ELF binary - RID/publish flags regressed. Got: $(file "$BIN")"
            exit 1
          fi

      - name: Package as agrumy-<app>-v<version>.tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_LOWER=$(echo "${{ matrix.app }}" | tr '[:upper:]' '[:lower:]' | tr -d '.')
          mkdir -p out
          # appsettings.json is git-ignored/never in the publish output on purpose (CLAUDE.md) -
          # install.sh writes it separately from deploy/*.template, never from this tarball.
          tar -C publish/${{ matrix.app }} -czf "out/agrumy-${APP_LOWER}-v${VERSION}.tar.gz" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.app }}
          path: out/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true

      - name: Write SHA256SUMS.txt
        run: |
          cd assets
          sha256sum *.tar.gz > SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Agrumy ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            assets/agrumy-*.tar.gz
            assets/SHA256SUMS.txt
